name: wo

services:
  server:
    image: 'wo-server:${BUILD_VERSION:-unresolved}'
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        BUILD_CREATED: '${BUILD_CREATED:-}'
        BUILD_REVISION: '${BUILD_REVISION:-}'
        BUILD_VERSION: '${BUILD_VERSION:-}'
        SOURCE_DATE_EPOCH: '${SOURCE_DATE_EPOCH:-}'
    restart: unless-stopped
    user: '0:0'
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETPCAP
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: '3000'
      PUBLIC_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}
      POSTGRES_DB: ${POSTGRES_DB:-wo}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER:-wo}
      TURN_REALM: ${TURN_REALM:?TURN_REALM is required}
      TURN_HOST: ${TURN_HOST:?TURN_HOST is required}
      TURN_URLS: ${TURN_URLS:?TURN_URLS is required}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-600}
      ROOM_CODE_TTL_SECONDS: ${ROOM_CODE_TTL_SECONDS:-600}
      ROOM_DISCONNECT_GRACE_SECONDS: ${ROOM_DISCONNECT_GRACE_SECONDS:-120}
      SCREEN_LEASE_TTL_SECONDS: ${SCREEN_LEASE_TTL_SECONDS:-15}
      SCREEN_BITRATE_MIN: ${SCREEN_BITRATE_MIN:-1000000}
      SCREEN_BITRATE_MAX: ${SCREEN_BITRATE_MAX:-20000000}
      EMAIL_DOMAIN_ALLOWLIST: ${EMAIL_DOMAIN_ALLOWLIST:-}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
      EMAIL_CODE_TTL_SECONDS: ${EMAIL_CODE_TTL_SECONDS:-600}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    ports:
      - 127.0.0.1:${WO_HTTP_PORT:-18080}:3000
    networks:
      - edge
      - db_internal
    secrets:
      - jwt_access_secret
      - postgres_password
      - turn_shared_secret
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700,noexec,nosuid,nodev

  postgres:
    image: postgres:17.10-alpine3.23
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wo}
      POSTGRES_USER: ${POSTGRES_USER:-wo}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - db_internal
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  coturn:
    image: 'wo-coturn:${BUILD_VERSION:-unresolved}'
    platform: linux/amd64
    build:
      context: .
      dockerfile: deploy/coturn/Dockerfile
      args:
        BUILD_CREATED: '${BUILD_CREATED:-}'
        BUILD_REVISION: '${BUILD_REVISION:-}'
        BUILD_VERSION: '${BUILD_VERSION:-}'
        SOURCE_DATE_EPOCH: '${SOURCE_DATE_EPOCH:-}'
    restart: unless-stopped
    user: '0:0'
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETPCAP
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    environment:
      TURN_EXTERNAL_IP: ${PUBLIC_IPV4:?PUBLIC_IPV4 is required}
      TURN_INTERNAL_IP: ${TURN_INTERNAL_IP:-}
      TURN_LISTEN_PORT: '3478'
      TURN_TLS_LISTEN_PORT: '5349'
      TURN_REALM: ${TURN_REALM:?TURN_REALM is required}
      TURN_RELAY_MIN_PORT: ${TURN_RELAY_MIN_PORT:-49160}
      TURN_RELAY_MAX_PORT: ${TURN_RELAY_MAX_PORT:-49200}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'exec /usr/local/bin/turn-healthcheck /run/secrets/turn_shared_secret "$$TURN_LISTEN_PORT" "$${TURN_INTERNAL_IP:-127.0.0.1}" >/dev/null 2>&1',
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - 0.0.0.0:${TURN_PORT:-3478}:3478/tcp
      - 0.0.0.0:${TURN_PORT:-3478}:3478/udp
      - 0.0.0.0:${TURN_TLS_PORT:-5349}:5349/tcp
      - 0.0.0.0:${TURN_RELAY_MIN_PORT:-49160}-${TURN_RELAY_MAX_PORT:-49200}:${TURN_RELAY_MIN_PORT:-49160}-${TURN_RELAY_MAX_PORT:-49200}/udp
    networks:
      - turn_edge
    secrets:
      - turn_shared_secret
      - turn_tls_cert
      - turn_tls_key
    tmpfs:
      - /run/wo-turn:uid=0,gid=0,mode=0700,size=4m,noexec,nosuid,nodev

networks:
  edge: {}
  db_internal:
    internal: true
  turn_edge: {}

secrets:
  jwt_access_secret:
    file: ${DEPLOY_SECRET_DIR:?DEPLOY_SECRET_DIR is required}/jwt_access_secret
  postgres_password:
    file: ${DEPLOY_SECRET_DIR:?DEPLOY_SECRET_DIR is required}/postgres_password
  turn_shared_secret:
    file: ${DEPLOY_SECRET_DIR:?DEPLOY_SECRET_DIR is required}/turn_shared_secret
  turn_tls_cert:
    file: ${DEPLOY_SECRET_DIR:?DEPLOY_SECRET_DIR is required}/turn_tls_cert.pem
  turn_tls_key:
    file: ${DEPLOY_SECRET_DIR:?DEPLOY_SECRET_DIR is required}/turn_tls_key.pem

volumes:
  postgres_data: {}
