name: wo-integration

services:
  caddy:
    image: wo-caddy:integration
    platform: !reset null
    build:
      args:
        BUILD_CREATED: '1970-01-01T00:00:01Z'
        BUILD_REVISION: '0000000000000000000000000000000000000000'
        BUILD_VERSION: integration
        SOURCE_DATE_EPOCH: '1'
    environment:
      ACME_EMAIL: integration@localhost.invalid
      APP_DOMAIN: rtc.localhost
    ports: !override
      - target: 80
        published: ${WO_INTEGRATION_HTTP_PORT:-80}
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 443
        published: ${WO_INTEGRATION_HTTPS_PORT:-443}
        host_ip: 127.0.0.1
        protocol: tcp
    volumes: !override
      - ./caddy/Caddyfile.integration:/etc/caddy/Caddyfile:ro
      - caddy_integration_data:/data
      - caddy_integration_config:/config

  server:
    image: wo-server:integration
    platform: !reset null
    build:
      args:
        BUILD_CREATED: '1970-01-01T00:00:01Z'
        BUILD_REVISION: '0000000000000000000000000000000000000000'
        BUILD_VERSION: integration
        SOURCE_DATE_EPOCH: '1'
    environment:
      NODE_ENV: test
      PUBLIC_URL: https://rtc.localhost
      TURN_REALM: turn.localhost
      TURN_HOST: turn.localhost
      TURN_URLS: stun:turn.localhost:3478,turn:turn.localhost:3478?transport=udp,turn:turn.localhost:3478?transport=tcp,turns:turn.localhost:5349?transport=tcp
      EMAIL_DOMAIN_ALLOWLIST: ''
      EMAIL_VERIFICATION_REQUIRED: 'false'
      SUPER_ADMIN_EMAILS: ''
      SMTP_HOST: ''
      SMTP_PORT: '587'
      SMTP_SECURE: 'false'
      SMTP_USER: ''
      SMTP_PASS: ''
      SMTP_FROM: ''

  postgres:
    platform: !reset null
    volumes: !override
      - postgres_integration_data:/var/lib/postgresql/data

  coturn:
    image: wo-coturn:integration
    platform: !reset null
    build:
      args:
        BUILD_CREATED: '1970-01-01T00:00:01Z'
        BUILD_REVISION: '0000000000000000000000000000000000000000'
        BUILD_VERSION: integration
        SOURCE_DATE_EPOCH: '1'
    environment:
      TURN_EXTERNAL_IP: 127.0.0.1
      TURN_LISTEN_PORT: '3478'
      TURN_TLS_LISTEN_PORT: '5349'
      TURN_REALM: turn.localhost
    ports: !override
      - target: 3478
        published: '3478'
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 3478
        published: '3478'
        host_ip: 127.0.0.1
        protocol: udp
      - target: 5349
        published: '5349'
        host_ip: 127.0.0.1
        protocol: tcp
      - 127.0.0.1:${TURN_RELAY_MIN_PORT:-49160}-${TURN_RELAY_MAX_PORT:-49200}:${TURN_RELAY_MIN_PORT:-49160}-${TURN_RELAY_MAX_PORT:-49200}/udp
    volumes: !override
      - ./coturn/entrypoint.sh:/opt/wo/turn-entrypoint.sh:ro
      - ./coturn/turnserver.integration.conf:/etc/coturn/turnserver.wo.conf:ro

volumes:
  caddy_integration_config: {}
  caddy_integration_data: {}
  postgres_integration_data: {}

secrets:
  jwt_access_secret:
    file: ./secrets.integration/jwt_access_secret
  postgres_password:
    file: ./secrets.integration/postgres_password
  turn_shared_secret:
    file: ./secrets.integration/turn_shared_secret
  turn_tls_cert:
    file: ./secrets.integration/turn_tls_cert.pem
  turn_tls_key:
    file: ./secrets.integration/turn_tls_key.pem
