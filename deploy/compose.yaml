name: wo

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --spider http://127.0.0.1:2019/config/ || exit 1',
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    ports:
      - target: 80
        published: '80'
        protocol: tcp
      - target: 443
        published: '443'
        protocol: tcp
    networks:
      - edge
      - api_internal
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    user: '0:0'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: '3000'
      PUBLIC_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      TURN_REALM: ${TURN_REALM:?TURN_REALM is required}
      TURN_HOST: ${TURN_HOST:?TURN_HOST is required}
      TURN_URLS: ${TURN_URLS:?TURN_URLS is required}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-600}
      ROOM_CODE_TTL_SECONDS: ${ROOM_CODE_TTL_SECONDS:-600}
      ROOM_DISCONNECT_GRACE_SECONDS: ${ROOM_DISCONNECT_GRACE_SECONDS:-120}
      SCREEN_LEASE_TTL_SECONDS: ${SCREEN_LEASE_TTL_SECONDS:-15}
      SCREEN_BITRATE_MIN: ${SCREEN_BITRATE_MIN:-1000000}
      SCREEN_BITRATE_MAX: ${SCREEN_BITRATE_MAX:-10000000}
    entrypoint: ['/bin/sh', '/opt/wo/server-entrypoint.sh']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - api_internal
      - db_internal
    secrets:
      - jwt_access_secret
      - postgres_password
      - turn_shared_secret
    volumes:
      - ./server/entrypoint.sh:/opt/wo/server-entrypoint.sh:ro

  postgres:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - db_internal
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  coturn:
    image: wo-coturn:4.14.0-r0-alpine
    build:
      context: ..
      dockerfile: deploy/coturn/Dockerfile
    restart: unless-stopped
    user: '0:0'
    environment:
      TURN_EXTERNAL_IP: ${PUBLIC_IPV4:?PUBLIC_IPV4 is required}
      TURN_LISTEN_PORT: '3478'
      TURN_TLS_LISTEN_PORT: '5349'
      TURN_REALM: ${TURN_REALM:?TURN_REALM is required}
      TURN_RELAY_MIN_PORT: ${TURN_RELAY_MIN_PORT:-49160}
      TURN_RELAY_MAX_PORT: ${TURN_RELAY_MAX_PORT:-49200}
    entrypoint: ['/bin/sh', '/opt/wo/turn-entrypoint.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'exec /usr/local/bin/turn-healthcheck /run/secrets/turn_shared_secret "$$TURN_LISTEN_PORT" >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - target: 3478
        published: ${TURN_PORT:-3478}
        protocol: tcp
      - target: 3478
        published: ${TURN_PORT:-3478}
        protocol: udp
      - target: 5349
        published: ${TURN_TLS_PORT:-5349}
        protocol: tcp
      - target: 5349
        published: ${TURN_TLS_PORT:-5349}
        protocol: udp
      - ${TURN_RELAY_MIN_PORT:-49160}-${TURN_RELAY_MAX_PORT:-49200}:${TURN_RELAY_MIN_PORT:-49160}-${TURN_RELAY_MAX_PORT:-49200}/udp
    networks:
      - turn_edge
    secrets:
      - turn_shared_secret
      - turn_tls_cert
      - turn_tls_key
    tmpfs:
      - /run/wo-turn:uid=65534,gid=65533,mode=0700
    volumes:
      - ./coturn/entrypoint.sh:/opt/wo/turn-entrypoint.sh:ro
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.wo.conf:ro

networks:
  edge: {}
  api_internal:
    internal: true
  db_internal:
    internal: true
  turn_edge: {}

secrets:
  jwt_access_secret:
    file: ${DEPLOY_SECRET_DIR:-./secrets}/jwt_access_secret
  postgres_password:
    file: ${DEPLOY_SECRET_DIR:-./secrets}/postgres_password
  turn_shared_secret:
    file: ${DEPLOY_SECRET_DIR:-./secrets}/turn_shared_secret
  turn_tls_cert:
    file: ${DEPLOY_SECRET_DIR:-./secrets}/turn_tls_cert.pem
  turn_tls_key:
    file: ${DEPLOY_SECRET_DIR:-./secrets}/turn_tls_key.pem

volumes:
  caddy_config: {}
  caddy_data: {}
  postgres_data: {}
