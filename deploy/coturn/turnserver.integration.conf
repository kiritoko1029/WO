use-auth-secret
fingerprint
allocation-default-address-family=ipv4
no-dtls
no-rfc5780
no-tcp-relay
no-auth-pings
no-dynamic-ip-list
no-dynamic-realms
allow-loopback-peers
relay-ip=127.0.0.1
relay-threads=1
no-multicast-peers
stale-nonce=600
userdb=/run/wo-turn/turndb
log-file=stdout
simple-log

# Integration-only policy. Never use this file for an Internet deployment.
allowed-peer-ip=127.0.0.1
allowed-peer-ip=::1
