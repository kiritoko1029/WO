fingerprint
use-auth-secret
allocation-default-address-family=ipv4
no-dtls
no-rfc5780
no-tcp-relay
no-auth-pings
no-dynamic-ip-list
no-dynamic-realms
no-multicast-peers
no-software-attribute
stale-nonce=600
user-quota=12
total-quota=1200
userdb=/run/wo-turn/turndb
log-file=stdout
simple-log

# Unspecified, current-host, private, link-local, CGNAT, benchmark,
# documentation, multicast, reserved, and cloud-metadata destinations.
denied-peer-ip=0.0.0.0-0.255.255.255
